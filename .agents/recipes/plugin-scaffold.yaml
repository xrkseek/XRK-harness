id: plugin-scaffold
title: 脚手架进程插件
description: 生成最小 XRK 进程插件目录（可选 kind）
prompt: |
  在 extensions/ 下创建最小进程插件（用户若指定 kind 则用指定；否则默认 tools）：
  - 支持 kind：`tools` | `prompt` | `commands` | `policy` | `hooks` | `llm` | `channel`
  - `xrk.plugin.json`（id / kind / entry；建议带 trust.note 声明「同进程全权」）
  - `plugin.mjs`（`createPlugin` + 该 kind 的最小贡献字段）
  - 对照金样：`extensions/example-<kind>/`（tools→example-tools，其余同名）
  形状见 docs/plugin-development.md · docs/plugin-loader.md。
  完成后给出：`xrkh plugin add <path>` 与 `xrkh restart`。
instructions: |
  只写能跑的最小文件。不要编造热重载；不要杀非 XRK 进程占端口。
  进程插件与 Host 同进程 — 在 README 或 trust.note 写明，勿假装沙箱。
parameters: []
