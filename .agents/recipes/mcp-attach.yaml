id: mcp-attach
title: 挂载 MCP 能力
description: 经 Settings MCP 粘贴 mcpServers 并确认连接
prompt: |
  Follow skill **xrk-capability-attach**:
  1. Confirm command+args or url, server id, allowConnect
  2. Emit pasteable {"mcpServers":{…}} (no env; secrets → Credentials)
  3. Guide: Settings → Plugins → Plugin config → Add from JSON → Save
