<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>XRK 干员</title>
  <meta name="description" content="挑选并下载 XRK Harness 干员包，发给向阳空间向日葵经理即可部署。"/>
  <link rel="icon" href="/logo-mark.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/site-foundation.css"/>
  <link rel="stylesheet" href="/site.css"/>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var p = (q === "light" || q === "dark" || q === "system") ? q : (localStorage.getItem("xrk-site-theme") || "system");
        if (q === "light" || q === "dark" || q === "system") {
          try { localStorage.setItem("xrk-site-theme", p); } catch (e2) {}
        }
        var dark = p === "dark" || (p !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
      try {
        var cn = new Date().getTimezoneOffset() === -480;
        if (!/(?:^|[?&])lang=/.test(location.search) && !cn) {
          location.replace(location.pathname + "?lang=en" + location.hash);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#catalog" data-i18n="skip">跳到干员列表</a>
  <header class="top" data-nav-open="false">
    <a class="brand" href="/" data-home>
      <span class="mark-wrap"><img class="mark" src="/logo-mark.svg" width="18" height="18" alt=""/></span>
      <span class="name" data-i18n="brand">XRK 干员</span>
    </a>
    <button type="button" class="nav-menu" data-nav-menu data-i18n-aria="menu" aria-expanded="false" aria-controls="site-nav" aria-label="菜单"><span class="nav-menu-icon" aria-hidden="true"><span></span></span></button>
    <nav class="nav" id="site-nav" aria-label="XRK operators">
      <a class="ghost" data-download-link href="https://xrk.indevs.in/" data-i18n="downloadSite">下载站</a>
      <a class="ghost" href="https://github.com/xrkseek/XRK-operator-packs/releases" data-i18n="github">GitHub</a>
      <button type="button" class="theme" data-theme-id="light" data-i18n-aria="light" aria-label="浅色">浅色</button>
      <button type="button" class="theme" data-theme-id="dark" data-i18n-aria="dark" aria-label="深色">深色</button>
      <button type="button" class="theme" data-theme-id="system" data-i18n-aria="system" aria-label="系统">系统</button>
      <a class="lang" data-lang-toggle href="?lang=en">EN</a>
    </nav>
  </header>

  <main class="page">
    <section class="sky">
      <div class="sky-copy">
        <h1 data-i18n="title">把干员交给朋友</h1>
        <p class="lead" data-i18n="lead">挑选干员下载，发给向阳空间向日葵经理即可部署。</p>
        <div class="cta">
          <a class="btn" data-download-link href="https://xrk.indevs.in/" data-i18n="getHarness">先装 Harness</a>
        </div>
      </div>
      <div class="constellation" id="constellation" aria-hidden="true"></div>
    </section>

    <section class="catalog" id="catalog">
      <div class="catalog-head">
        <h2 data-i18n="listTitle">干员列表</h2>
        <label class="search">
          <span class="sr" data-i18n="searchLabel">搜索</span>
          <input type="search" id="filter" data-i18n-placeholder="searchPh" placeholder="搜名字或简介" autocomplete="off"/>
        </label>
      </div>
      <div id="member-list" class="member-list" aria-live="polite"></div>
      <p id="empty" class="empty" hidden data-i18n="empty">还没有公开包。上架后会出现在这里；天幕里是预置干员。</p>
    </section>

    <footer class="foot">
      <span data-i18n="mit">MIT</span>
      <a data-download-link href="https://xrk.indevs.in/" data-i18n="downloadSite">下载站</a>
      <a href="https://github.com/xrkseek/XRK-operator-packs/releases">GitHub Releases</a>
      <a href="https://www.npmjs.com/package/@xrkseek/harness-cli">@xrkseek/harness-cli</a>
    </footer>
  </main>

  <script src="/site.js" defer></script>
</body>
</html>
