id: models-config
title: Configure models
description: Settings Models card + chat chip (load xrk-models-settings)
prompt: |
  Load skill **xrk-models-settings**. Guide or perform: Settings → Models (provider + API key,
  Base URL if custom) → add Model ID (optional fetch list) → **Save** the card → pick in chat chip
  or `/model`. Do not mutate settings without confirmation. Keys stay in Credentials.
instructions: |
  Empty picker usually means unsaved card — save before debugging the chip.
parameters: []
