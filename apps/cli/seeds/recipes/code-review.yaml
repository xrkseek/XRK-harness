id: code-review
title: Code review
description: Read-only defect-first review (load xrk-code-review)
prompt: |
  Load skill **xrk-code-review**, then review the change the user named (diff / PR / uncommitted).
  Report only actionable defects this change introduced — `[P0]`…`[P3]` list, or `No findings.`
  Do not edit files or commit. Large scope: may spawn a read-only subagent with a full brief.
instructions: |
  Checklist and severity rules live in the skill body — load it first.
parameters: []
