id: mcp-attach
title: Attach / edit MCP
description: Host Settings MCP via settings_mutate (global ~/.xrk)
prompt: |
  Load skill **xrk-capability-attach**. Use **settings_get** then **settings_mutate** on Host Settings
  (global `~/.xrk`, not the workspace folder) to add/edit MCP: `servers[]`, allowConnect, args/cwd/proxy env.
  Wait for remount; verify with `/mcp`. Never put secrets in MCP env — Credentials only.
instructions: |
  Prefer settings_mutate over pasting Settings YAML by hand.
parameters: []
