id: mcp-attach
title: 挂载 / 改 MCP
description: settings_mutate ns=mcp（全局 Host ~/.xrk）
prompt: |
  Use **settings_get** / **settings_mutate** on Host Settings (global ~/.xrk — not the workspace folder).
  For MCP: set/merge servers[] + allowConnect; may edit args/cwd/proxy env (HTTP_PROXY…).
  Wait for tool result (connect). Verify with /mcp.
instructions: |
  Prefer settings_mutate over coaching Settings paste. Do not write secrets into mcp env.
parameters: []
