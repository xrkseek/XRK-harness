id: plugin-scaffold
title: 脚手架进程插件
description: 生成最小 XRK tools 进程插件目录
prompt: |
  在当前 workspace 创建一个最小 `tools` 进程插件目录：
  - `xrk.plugin.json`（id / kind / entry）
  - `plugin.mjs`（`createPlugin` + 一个示例工具）
  对照 `extensions/example-tools` 的形状。
  完成后给出：`xrkh plugin add <path>` 与 `xrkh restart` 的命令。
instructions: |
  你是 XRK 插件教练。只写能跑的最小文件，不编造热重载。
  不要建议杀掉端口上的非 XRK 进程。
parameters: []
