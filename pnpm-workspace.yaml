packages:
  - "apps/*"
  - "packages/*"
  - "packages/client/*"
  - "packages/context/*"
  - "packages/stubs/*"
  - "packages/core/*"
  - "packages/session/*"
  - "packages/llm/*"
  - "packages/exec/*"
  - "packages/server/*"
  - "presets/*"
  - "examples/*"
  - "extensions/*"
# pnpm ≥10：仅允许下列包跑 lifecycle
allowBuilds:
  "@xrkseek/exec-pty": true
  "@xrkseek/exec-pty@file:packages/exec/pty": true
  esbuild: true
  node-pty: true
  sharp: true
