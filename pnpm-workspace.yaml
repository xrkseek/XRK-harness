packages:
  # Product apps: cli · web · console · desktop · desktop-host (Node ≥26)
  - "apps/*"
  - "packages/*"
  - "packages/client/*"
  - "packages/context/*"
  - "packages/stubs/*"
  - "packages/core/*"
  - "packages/util/*"
  - "packages/session/*"
  - "packages/runtime-diagnostics/*"
  - "packages/llm/*"
  - "packages/exec/*"
  - "packages/server/*"
  - "presets/*"
  - "extensions/example-tools"
  - "extensions/example-channel"
  - "extensions/example-composer-action"
  - "extensions/example-theme-tokens"
  - "extensions/example-shell-wallpaper"
  - "extensions/example-shell-pet"
  - "extensions/example-workbench-push"
  - "extensions/example-im-mock-sidecar"
  - "extensions/dsh-compat"
  - "extensions/a2a"
  - "extensions/git-worktrees"
# pnpm ≥10：仅允许下列包跑 lifecycle
allowBuilds:
  "@google/genai": false
  "@xrkseek/exec-pty": true
  "@xrkseek/exec-pty@file:packages/exec/pty": true
  # Download platform CLI binaries into Desktop Host node_modules.
  agent-browser: true
  agent-desktop: true
  electron: true
  electron-winstaller: true
  esbuild: true
  keytar: false
  node-pty: true
  protobufjs: false
  sharp: true
minimumReleaseAgeExclude:
  - agent-desktop@1.3.1
  - agent-browser@0.43.0
  - "@earendil-works/pi-ai@1.6.0"
  - '@earendil-works/pi-schema@1.6.0'
  - '@earendil-works/pi-telemetry@1.6.0'
