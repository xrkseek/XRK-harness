packages:
  - "apps/*"
  - "packages/*"
  - "packages/client/*"
  - "packages/stubs/*"
  - "packages/core/*"
  - "packages/llm/*"
  - "packages/exec/*"
  - "packages/server/*"
  - "presets/*"
  - "examples/*"
  - "extensions/*"
# pnpm ≥10：仅允许下列包跑 lifecycle（esbuild / node-pty）
allowBuilds:
  esbuild: true
  node-pty: true
